name: Agente SOL veloce (simulazione)
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: agente-veloce
  cancel-in-progress: false
jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests tzdata
      - name: Controllo agente veloce
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agente.py --config config_veloce.json --una-volta
      - name: Salva risultati
        run: |
          git config user.name "agente-bot"
          git config user.email "agente-bot@users.noreply.github.com"
          for f in decisioni_veloce.csv operazioni_veloce.csv stato_veloce_paper.json cache_notizie_veloce.json agente_veloce.log; do if [ -f "$f" ]; then git add -f "$f"; fi; done
          git commit -m "Controllo veloce $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*5)); done
